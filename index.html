<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>toeberts live goal overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; background:transparent; overflow:hidden;
    font-family:'Bahnschrift','Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

  .panel {
    position:absolute; top:40px; left:40px; width:340px; padding:16px 18px 18px;
    border-radius:16px;
    background:linear-gradient(158deg, rgba(23,24,32,0.97) 0%, rgba(12,13,18,0.98) 100%);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 16px 36px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .hdr { display:flex; align-items:center; gap:10px; margin-bottom:15px; }
  .live { display:inline-flex; align-items:center; gap:6px; padding:4px 11px 4px 9px;
    border-radius:999px; background:linear-gradient(135deg,var(--a1),var(--a2));
    box-shadow:0 4px 12px var(--glow45); font-weight:700; font-size:13px; letter-spacing:1.5px; color:#fff;
    transition:.3s; }
  .live.off { background:rgba(255,255,255,.14); box-shadow:none; color:rgba(255,255,255,.6); }
  .live .d { width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 6px #fff;
    animation:pulse 1.4s ease-in-out infinite; }
  .live.off .d { animation:none; background:rgba(255,255,255,.5); box-shadow:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .handle { font-size:21px; font-weight:700; letter-spacing:.3px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .viewers { margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:rgba(255,255,255,.6); }
  .viewers .eye { font-family:'Segoe UI Symbol'; font-size:12px; color:var(--a1); }

  .row { margin-top:13px; }
  .rowtop { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  .lbl { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; letter-spacing:.8px; color:#e9ebf1; }
  .icon { font-family:'Segoe UI Symbol','Segoe UI'; font-size:13px;
    background:linear-gradient(135deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .num { font-size:13px; font-weight:700; letter-spacing:.5px; color:#fff; }
  .num .goal { color:rgba(255,255,255,.4); font-weight:600; }
  .bar { height:9px; border-radius:999px; background:rgba(255,255,255,.09); box-shadow:inset 0 1px 2px rgba(0,0,0,.5); overflow:hidden; }
  .fill { height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--a1),var(--a2)); box-shadow:0 0 10px var(--glow60);
    position:relative; transition:width .6s cubic-bezier(.2,.7,.2,1); }
  .fill::after { content:''; position:absolute; inset:0 0 50% 0; border-radius:999px 999px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.30), transparent); }

  .lt { position:absolute; left:40px; bottom:38px; height:48px; display:flex; align-items:center;
    padding:0 22px 0 15px; border-radius:12px;
    background:linear-gradient(158deg, rgba(23,24,32,0.97), rgba(12,13,18,0.98));
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 14px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.10); }
  .cap { width:4px; height:24px; border-radius:2px; margin-right:14px;
    background:linear-gradient(180deg,var(--a1),var(--a2)); box-shadow:0 0 10px var(--glow55); }
  .gname { font-size:23px; font-weight:700; letter-spacing:1.5px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .sep { width:6px; height:6px; border-radius:50%; margin:0 14px;
    background:linear-gradient(135deg,var(--a1),var(--a2)); box-shadow:0 0 6px var(--glow60); display:none; }
  .capt { font-size:17px; font-weight:600; letter-spacing:.3px; color:rgba(255,255,255,.85); }

  #dbg { position:absolute; right:12px; bottom:12px; width:520px; max-height:360px; overflow:auto;
    background:rgba(0,0,0,.82); color:#8f8; font:11px/1.35 monospace; padding:8px 10px; border-radius:8px;
    white-space:pre-wrap; display:none; z-index:9; }
  #dbg b { color:#fd6; }
</style>
</head>
<body>
  <div class="panel">
    <div class="hdr">
      <span class="live off" id="livepill"><span class="d"></span><span id="livetxt">OFFLINE</span></span>
      <span class="handle" id="handle">@toeberts</span>
      <span class="viewers"><span class="eye">&#128065;</span><span id="viewers">0</span></span>
    </div>
    <div class="row">
      <div class="rowtop">
        <span class="lbl"><span class="icon">&#9733;</span>FOLLOWERS</span>
        <span class="num"><span id="fnum">0</span> <span class="goal">/ <span id="fgoal">100</span></span></span>
      </div>
      <div class="bar"><div class="fill" id="ffill"></div></div>
    </div>
    <div class="row">
      <div class="rowtop">
        <span class="lbl"><span class="icon">&#9829;</span>LIKES</span>
        <span class="num"><span id="lnum">0</span> <span class="goal">/ <span id="lgoal">10K</span></span></span>
      </div>
      <div class="bar"><div class="fill" id="lfill"></div></div>
    </div>
  </div>

  <div class="lt">
    <div class="cap"></div>
    <span class="gname" id="gname">ROBLOX</span>
    <span class="sep" id="sep"></span>
    <span class="capt" id="capt"></span>
  </div>

  <div id="dbg"></div>

<script type="module">
  import { createWebSocketUrl, ClientCloseCode }
    from 'https://cdn.jsdelivr.net/npm/@eulerstream/euler-websocket-sdk/+esm';

  // ---------- config from URL query params (key stays local, never in the repo) ----------
  const q = new URLSearchParams(location.search);
  const GAMES = {
    roblox:    { name:'ROBLOX',        a1:'#ff4d8d', a2:'#b455ff', glow:'255,77,141' },
    minecraft: { name:'MINECRAFT',     a1:'#54e08a', a2:'#22a35a', glow:'84,224,138' },
    blackops3: { name:'BLACK OPS III', a1:'#4cc2ff', a2:'#2f6bff', glow:'76,194,255' }
  };
  const g = GAMES[(q.get('game')||'roblox').toLowerCase()] || GAMES.roblox;
  const user  = (q.get('user')||'toeberts').replace(/^@/,'');
  const key   = q.get('key') || '';
  const fGoal = +(q.get('fgoal')||100);
  const lGoal = +(q.get('lgoal')||10000);
  const cap   = q.get('cap');
  const DEBUG = q.get('debug')==='1';

  const r = document.documentElement.style;
  r.setProperty('--a1', g.a1); r.setProperty('--a2', g.a2);
  r.setProperty('--glow45','rgba('+g.glow+',0.45)');
  r.setProperty('--glow55','rgba('+g.glow+',0.55)');
  r.setProperty('--glow60','rgba('+g.glow+',0.60)');
  document.getElementById('gname').textContent = g.name;
  document.getElementById('handle').textContent = '@'+user;
  document.getElementById('fgoal').textContent = fmt(fGoal);
  document.getElementById('lgoal').textContent = fmt(lGoal);
  if (cap) { document.getElementById('capt').textContent = cap; document.getElementById('sep').style.display='inline-block'; }
  if (DEBUG) document.getElementById('dbg').style.display='block';

  // ---------- state ----------
  let followers = 0, likes = 0, viewers = 0;
  function fmt(n){ n=+n||0; return n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'K' : ''+n; }
  function render(){
    document.getElementById('viewers').textContent = fmt(viewers);
    document.getElementById('fnum').textContent = fmt(followers);
    document.getElementById('lnum').textContent = fmt(likes);
    document.getElementById('ffill').style.width = Math.min(100,(followers/(fGoal||1))*100)+'%';
    document.getElementById('lfill').style.width = Math.min(100,(likes/(lGoal||1))*100)+'%';
  }
  function setLive(on){
    const p=document.getElementById('livepill');
    document.getElementById('livetxt').textContent = on?'LIVE':'OFFLINE';
    p.classList.toggle('off', !on);
  }
  render();

  // ---------- debug log ----------
  const seen = {};
  function log(ev){
    if(!DEBUG) return;
    const t = eventType(ev) || '(no type)';
    seen[t] = (seen[t]||0)+1;
    const box=document.getElementById('dbg');
    box.textContent = '@'+user+'  seen event types:\n' +
      Object.entries(seen).map(([k,v])=>`  ${k}: ${v}`).join('\n') +
      '\n\nlast message:\n' + JSON.stringify(ev, null, 1).slice(0,1400);
    console.log('[overlay]', t, ev);
  }

  // ---------- defensive parsing ----------
  function eventType(ev){ return (ev?.type||ev?.event||ev?.method||ev?.name||ev?.eventName||'').toString(); }
  function handleOne(ev){
    log(ev);
    const type = eventType(ev).toLowerCase();
    const d = ev?.data || ev?.payload || ev || {};
    if (type.includes('like')) {
      const total = d.totalLikeCount ?? d.total_like_count ?? d.totalLikes ?? null;
      if (total != null) likes = +total;
      else { const c = d.likeCount ?? d.count ?? d.likes; if (c!=null) likes += +c; }
      render();
    } else if (type.includes('follow') || type.includes('social')) {
      const action = d.action ?? d.socialAction;
      const label = (d.label ?? d.displayType ?? '').toString().toLowerCase();
      const isFollow = type.includes('follow') || String(action)==='1' || label.includes('follow');
      if (isFollow) { followers++; render(); }
    } else if (type.includes('roomuser') || type.includes('room_user') || type.includes('roomstats')) {
      const v = d.viewerCount ?? d.viewer_count ?? d.total ?? d.totalUser ?? d.totalUserCount;
      if (v != null) { viewers = +v; render(); }
    }
  }
  function handle(msg){
    if (Array.isArray(msg)) return msg.forEach(handleOne);
    if (Array.isArray(msg?.events)) return msg.events.forEach(handleOne);
    handleOne(msg);
  }

  // ---------- connect ----------
  if (!key) {
    document.getElementById('dbg').style.display='block';
    document.getElementById('dbg').textContent =
      'No API key. Add &key=YOUR_EULER_KEY&user='+user+' to the URL.';
  } else {
    connect();
  }
  function connect(){
    const url = createWebSocketUrl({ uniqueId:'@'+user, jwtKey:key, features:{ bundleEvents:true } });
    const ws = new WebSocket(url);
    ws.addEventListener('open',  ()=> setLive(true));
    ws.addEventListener('message', e => { try { handle(JSON.parse(e.data)); } catch(err){ if(DEBUG) console.warn(err, e.data); } });
    ws.addEventListener('close', e => {
      setLive(false);
      if (e.code === ClientCloseCode?.NOT_LIVE) { /* streamer offline */ }
      setTimeout(connect, 15000); // auto-reconnect
    });
    ws.addEventListener('error', ()=> setLive(false));
  }
</script>
</body>
</html>
